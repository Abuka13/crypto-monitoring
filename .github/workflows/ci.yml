name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон — не держим очередь.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_monitoring_test
        ports:
          - 5432:5432
        # Джоб стартует только когда база реально готова принимать соединения.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Тестовые значения. Настоящих ключей в CI нет и не требуется:
      # все внешние вызовы (Etherscan, LLM-провайдеры) в тестах замоканы.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_monitoring_test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-used-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply schema and migrations
        # Проверяем, что db/schema.sql и все миграции накатываются без ошибок и
        # согласованы между собой: миграции идемпотентны, поэтому поверх полной
        # схемы они должны проходить вхолостую.
        # (Саму тестовую БД pytest-django создаёт отдельно и накатывает на неё
        # schema.sql через фикстуру django_db_setup — см. tests/conftest.py.)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          for f in db/migrations/*.sql; do
            echo "-- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
