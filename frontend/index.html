<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финмониторинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- React UMD (без сборки/Babel: верстаем через React.createElement + css-хелпер) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#0a0a0c; --panel:#121317; --rail:#0d0d10; --card:#15161b; --card2:#1c1e25;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.04);
  --text:#f3f4f6; --muted:#8b8f99; --muted2:#565a64;
  --accent:#5fded0; --accent2:#36c9b5; --accent-soft:rgba(95,222,208,.13);
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
[data-theme="light"]{
  --bg:#eef0f4; --panel:#ffffff; --rail:#ffffff; --card:#ffffff; --card2:#f4f6f9;
  --border:rgba(15,23,42,.09); --border2:rgba(15,23,42,.05);
  --text:#11151c; --muted:#5f6675; --muted2:#aab0bd;
  --accent:#0fab9c; --accent2:#0c8c80; --accent-soft:rgba(15,171,156,.12);
  --shadow:0 18px 44px rgba(15,23,42,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
#root{height:100%;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--muted2);}
input::placeholder{color:var(--muted2);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.6);}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const API = '/api';

// Парсер inline-CSS строки -> объект стиля React (чтобы переиспользовать стили дизайна как есть).
function css(str){
  const o = {};
  if(!str) return o;
  str.split(';').forEach(part=>{
    const i = part.indexOf(':'); if(i < 0) return;
    let k = part.slice(0,i).trim(); let v = part.slice(i+1).trim();
    if(!k) return;
    k = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[k] = v;
  });
  return o;
}

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function patchJSON(url, body){
  const r = await fetch(url, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(()=>({}));
  return { ok:r.ok, status:r.status, data };
}

class App extends React.Component {
  constructor(props){
    super(props);
    this.state = {
      loggedIn:false, theme:'dark', lang:'ru', screen:'dashboard',
      sidebarExpanded:true,
      fRisk:'all', fStatus:'all', fType:'all', q:'', alertsView:'table',
      wRisk:'all', wFlag:'all',
      selected:null, selectedKind:null, detailData:null,
      alerts:[], wallets:[], txs:[], rules:[],
      loading:true, error:'', toast:'',
    };
  }

  componentDidMount(){ this.loadAll(); }
  componentWillUnmount(){ clearTimeout(this._tt); }

  async loadAll(){
    try{
      this.setState({loading:true, error:''});
      const [alertsResp, wallets, txs, rules] = await Promise.all([
        getJSON(API + '/alerts/?limit=1000'),
        getJSON(API + '/wallets/'),
        getJSON(API + '/transactions/'),
        getJSON(API + '/rules/'),
      ]);
      const alerts = (alertsResp.results || alertsResp).map(a => Object.assign({}, a, {_ts: Date.parse(a.created_at)}));
      this.setState({alerts, wallets, txs, rules, loading:false});
    }catch(e){
      this.setState({loading:false, error:'Не удалось загрузить данные API: ' + e.message});
    }
  }

  // ---------- meta ----------
  RISK = {
    high:{color:'#ff6f6f', bg:'rgba(255,90,90,.13)'},
    medium:{color:'#f5b54a', bg:'rgba(245,170,60,.14)'},
    low:{color:'#34d399', bg:'rgba(52,211,153,.13)'}
  };
  STAT = {
    open:{color:'#f5b54a', bg:'rgba(245,170,60,.13)'},
    in_progress:{color:'#5fded0', bg:'rgba(95,222,208,.14)'},
    closed:{color:'#34d399', bg:'rgba(52,211,153,.13)'},
    false_positive:{color:'#9aa3b2', bg:'rgba(150,160,180,.13)'}
  };
  TYPE = {
    tx:{label:'TX', color:'#5fded0', bg:'rgba(95,222,208,.14)'},
    wlt:{label:'WLT', color:'#a5b4fc', bg:'rgba(129,140,248,.16)'}
  };
  TXSTAT = {
    success:{c:'#34d399', b:'rgba(52,211,153,.13)'},
    pending:{c:'#f5b54a', b:'rgba(245,170,60,.13)'},
    failed:{c:'#ff6f6f', b:'rgba(255,90,90,.13)'}
  };

  ICONS = {
    dashboard:['M3 3h7v7H3z','M14 3h7v7h-7z','M14 14h7v7h-7z','M3 14h7v7H3z'],
    alerts:['M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9','M13.7 21a2 2 0 0 1-3.4 0'],
    wallets:['M3 7a2 2 0 0 1 2-2h13v4','M3 7v10a2 2 0 0 0 2 2h15V7H3z','M16 12.5h0.01'],
    transactions:['M17 1l4 4-4 4','M3 11V9a4 4 0 0 1 4-4h14','M7 23l-4-4 4-4','M21 13v2a4 4 0 0 1-4 4H3'],
    rules:['M4 21v-7','M4 10V3','M12 21v-9','M12 8V3','M20 21v-5','M20 12V3','M1 14h6','M9 8h6','M17 16h6'],
    search:['M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z','M21 21l-4.3-4.3'],
    sun:['M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z','M12 1v2','M12 21v2','M4.2 4.2l1.4 1.4','M18.4 18.4l1.4 1.4','M1 12h2','M21 12h2','M4.2 19.8l1.4-1.4','M18.4 5.6l1.4-1.4'],
    moon:['M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'],
    copy:['M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1z','M5 15a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1'],
    chevronLeft:['M15 18l-6-6 6-6'],
    chevronRight:['M9 18l6-6-6-6'],
    menu:['M3 6h18','M3 12h18','M3 18h18'],
    logout:['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4','M16 17l5-5-5-5','M21 12H9'],
    close:['M18 6L6 18','M6 6l12 12'],
    shield:['M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'],
    bell:['M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9','M13.7 21a2 2 0 0 1-3.4 0'],
    user:['M20 21a8 8 0 1 0-16 0','M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
    flag:['M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z','M4 22v-7'],
    lock:['M5 11h14v10H5z','M8 11V7a4 4 0 0 1 8 0v4']
  };
  icon(name,size,sw){
    const paths = this.ICONS[name]||[];
    return h('svg',{width:size||20,height:size||20,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:sw||1.8,strokeLinecap:'round',strokeLinejoin:'round'},
      paths.map((d,i)=>h('path',{key:i,d:d})));
  }

  // ---------- formatting ----------
  weiToEth(weiStr,dp){
    dp = dp==null?3:dp;
    try{
      const v=BigInt(weiStr); const base=10n**18n;
      const whole=v/base; const frac=v%base;
      let fracStr=frac.toString().padStart(18,'0').slice(0,dp).replace(/0+$/,'');
      let wholeStr=whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
      return fracStr? wholeStr+'.'+fracStr : wholeStr;
    }catch(e){ return '0'; }
  }
  shorten(s,a,b){ a=a||6; b=b||4; if(!s) return ''; return s.slice(0,a)+'…'+s.slice(-b); }
  fmtDate(ms){ if(!ms) return '—'; const d=new Date(ms); const p=n=>(n<10?'0':'')+n; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  num(n){ return (n==null?0:n).toLocaleString('ru-RU'); }

  // ---------- charts ----------
  areaChart(series,ht){
    const w=620,pad=6; ht=ht||190;
    const max=Math.max(1,...series); const n=series.length;
    const xs=i=> pad + i*(w-2*pad)/(n-1);
    const ys=v=> ht-pad - (v/max)*(ht-2*pad-12);
    let line=''; series.forEach((v,i)=>{ line+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)+' '; });
    const area=line+'L'+xs(n-1).toFixed(1)+' '+ht+' L'+xs(0).toFixed(1)+' '+ht+' Z';
    return h('svg',{viewBox:'0 0 '+w+' '+ht,preserveAspectRatio:'none',style:{width:'100%',height:ht,display:'block'}},
      h('defs',null,h('linearGradient',{id:'tgrad',x1:0,y1:0,x2:0,y2:1},
        h('stop',{offset:'0%',stopColor:'var(--accent)',stopOpacity:0.34}),
        h('stop',{offset:'100%',stopColor:'var(--accent)',stopOpacity:0}))),
      h('path',{d:area,fill:'url(#tgrad)'}),
      h('path',{d:line,fill:'none',stroke:'var(--accent)',strokeWidth:2.5,strokeLinejoin:'round',strokeLinecap:'round'}));
  }
  barChart(items){
    const max=Math.max(1,...items.map(i=>i.value));
    return h('div',{style:{display:'flex',alignItems:'flex-end',gap:12,height:150,padding:'0 2px'}},
      items.map((it,i)=>h('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,height:'100%',justifyContent:'flex-end'}},
        h('div',{style:{fontSize:13,fontWeight:700,color:'var(--text)',fontFamily:'JetBrains Mono, monospace'}},String(it.value)),
        h('div',{style:{width:'100%',maxWidth:30,height:Math.max(4,it.value/max*100)+'%',background:it.color,borderRadius:'7px 7px 3px 3px',transition:'height .7s cubic-bezier(.2,.8,.2,1)'}}),
        h('div',{style:{fontSize:10.5,color:'var(--muted)',textAlign:'center',lineHeight:1.2,minHeight:24}},it.label))));
  }
  donut(items,total){
    const r=52,c=2*Math.PI*r,cx=70,cy=70; let off=0;
    const segs=items.filter(i=>i.value>0).map((it,i)=>{
      const len=(it.value/(total||1))*c;
      const el=h('circle',{key:i,cx:cx,cy:cy,r:r,fill:'none',stroke:it.color,strokeWidth:15,strokeDasharray:len.toFixed(2)+' '+(c-len).toFixed(2),strokeDashoffset:(-off).toFixed(2),transform:'rotate(-90 '+cx+' '+cy+')',style:{transition:'stroke-dasharray .7s ease'}});
      off+=len; return el;
    });
    return h('svg',{width:140,height:140,viewBox:'0 0 140 140',style:{flexShrink:0}},
      h('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:'var(--border)',strokeWidth:15}), segs);
  }
  ringGauge(score,color){
    const r=46,c=2*Math.PI*r; const len=(score/100)*c;
    return h('svg',{width:120,height:120,viewBox:'0 0 120 120'},
      h('circle',{cx:60,cy:60,r:r,fill:'none',stroke:'var(--border)',strokeWidth:9}),
      h('circle',{cx:60,cy:60,r:r,fill:'none',stroke:color,strokeWidth:9,strokeLinecap:'round',strokeDasharray:len.toFixed(2)+' '+(c-len).toFixed(2),transform:'rotate(-90 60 60)',style:{transition:'stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)'}}));
  }
  semiGauge(pct,color){
    const r=70,c=Math.PI*r; const len=pct*c;
    return h('svg',{viewBox:'0 0 180 104',style:{width:'100%',maxWidth:230,display:'block',margin:'0 auto'}},
      h('path',{d:'M16 92 A74 74 0 0 1 164 92',fill:'none',stroke:'var(--border)',strokeWidth:15,strokeLinecap:'round'}),
      h('path',{d:'M16 92 A74 74 0 0 1 164 92',fill:'none',stroke:color,strokeWidth:15,strokeLinecap:'round',strokeDasharray:len.toFixed(2)+' '+(c-len).toFixed(2),style:{transition:'stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)'}}));
  }

  // ---------- stats ----------
  computeStats(){
    const a=this.state.alerts; const now=Date.now();
    const s={total:a.length,open:0,in_progress:0,closed:0,false_positive:0,high:0,medium:0,low:0,last24:0,flagged:0};
    a.forEach(x=>{ if(s[x.status]!=null) s[x.status]++; if(s[x.level]!=null) s[x.level]++; if(now-x._ts<24*3600*1000) s.last24++; });
    s.flagged=this.state.wallets.filter(w=>w.is_flagged).length;
    return s;
  }
  trendSeries(){
    const a=this.state.alerts; const days=14; const now=Date.now(); const arr=new Array(days).fill(0);
    a.forEach(x=>{ const d=Math.floor((now-x._ts)/(24*3600*1000)); if(d>=0&&d<days) arr[days-1-d]++; });
    return arr;
  }

  // ---------- helpers ----------
  riskBucket(score){ return score>=70?'high':score>=40?'medium':'low'; }
  T_(){ return this.T[this.state.lang]; }
  showToast(msg){ this.setState({toast:msg}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:''}),1600); }
  copy(text){ try{ navigator.clipboard && navigator.clipboard.writeText(text); }catch(e){} this.showToast(this.T_().copied); }
  chip(label,active,onClick){
    return {label:label,active:active,onClick:onClick,
      style:active?'background:var(--accent);color:#06201c;border:1px solid transparent;font-weight:700;':'background:transparent;color:var(--muted);border:1px solid var(--border);'};
  }
  setScreen(id){ this.setState({screen:id,selected:null,selectedKind:null,detailData:null}); }

  // ---------- detail ----------
  async openAlert(a){
    this.setState({selected:a,selectedKind:'alert',detailData:null});
    try{ const d=await getJSON(API + '/alerts/' + a.id + '/'); this.setState({detailData:d}); }
    catch(e){ this.showToast('Ошибка загрузки деталей'); }
  }
  openWallet(w){ this.setState({selected:w,selectedKind:'wallet',detailData:null}); }
  openTx(x){ this.setState({selected:x,selectedKind:'tx',detailData:null}); }
  closeDetail(){ this.setState({selected:null,selectedKind:null,detailData:null}); }

  async setStatus(ns){
    const sel=this.state.selected; if(!sel) return;
    const res=await patchJSON(API + '/alerts/' + sel.id + '/status/', {status:ns});
    if(!res.ok){ this.showToast(res.data.detail || 'Недопустимый переход'); return; }
    const upd=res.data;
    const alerts=this.state.alerts.map(a=>a.id===sel.id?Object.assign({},a,{status:upd.status,resolved_at:upd.resolved_at}):a);
    const detailData=this.state.detailData?Object.assign({},this.state.detailData,{status:upd.status,resolved_at:upd.resolved_at}):null;
    this.setState({alerts:alerts,detailData:detailData});
    this.showToast(this.T_().statusChanged);
  }
  async toggleRule(r){
    const res=await patchJSON(API + '/rules/' + r.id + '/', {is_active:!r.is_active});
    if(!res.ok){ this.showToast('Не удалось изменить правило'); return; }
    const rules=this.state.rules.map(x=>x.id===r.id?Object.assign({},x,{is_active:res.data.is_active}):x);
    this.setState({rules:rules});
  }

  // ---------- filters ----------
  getFilteredAlerts(){
    const s=this.state; const ql=s.q.trim().toLowerCase();
    return s.alerts.filter(a=>{
      if(s.fRisk!=='all'&&a.level!==s.fRisk) return false;
      if(s.fStatus!=='all'&&a.status!==s.fStatus) return false;
      if(s.fType!=='all'&&a.target_type!==s.fType) return false;
      if(ql){ const hay=(('#'+a.id)+' '+(a.title||'')+' '+(a.description||'')).toLowerCase(); if(!hay.includes(ql)) return false; }
      return true;
    });
  }
  getFilteredWallets(){
    const s=this.state;
    return s.wallets.filter(w=>{
      if(s.wRisk!=='all'&&this.riskBucket(w.risk_score)!==s.wRisk) return false;
      if(s.wFlag==='flagged'&&!w.is_flagged) return false;
      return true;
    });
  }

  // ---------- view models ----------
  alertVM(a){
    const t=this.T_(); const rm=this.RISK[a.level]||this.RISK.low; const sm=this.STAT[a.status]||this.STAT.open;
    const tm=a.target_type==='transaction'?this.TYPE.tx:this.TYPE.wlt;
    return {
      raw:a, id:'#'+a.id, typeLabel:tm.label, typeStyle:'background:'+tm.bg+';color:'+tm.color+';',
      title:a.title||'—', desc:a.description||'',
      riskLabel:t.risk[a.level]||a.level, riskStyle:'background:'+rm.bg+';color:'+rm.color+';border:1px solid '+rm.color+'40;',
      statusLabel:t.status[a.status]||a.status, statusStyle:'background:'+sm.bg+';color:'+sm.color+';',
      score:a.final_score, scoreColor:rm.color, dateStr:this.fmtDate(a._ts),
      isHigh:(a.level==='high'&&a.status==='open'),
      onOpen:()=>this.openAlert(a)
    };
  }
  walletVM(w){
    const t=this.T_(); const bk=this.riskBucket(w.risk_score); const rm=this.RISK[bk];
    const lbl = w.label? (t.labels[w.label]||w.label) : t.labels.none;
    const lblColor = w.label==='mixer'||w.label==='миксер'?'#ff6f6f':(w.label==='fraud'||w.label==='мошенник'?'#f5b54a':(w.label==='exchange'||w.label==='биржа'?'#5fded0':'#9aa3b2'));
    return {
      raw:w, address:w.address, short:this.shorten(w.address),
      label:lbl, labelStyle:'background:'+lblColor+'1f;color:'+lblColor+';',
      txCount:this.num(w.transaction_count),
      received:this.weiToEth(w.total_received,2), sent:this.weiToEth(w.total_sent,2),
      risk:Math.round(w.risk_score), riskColor:rm.color, flagged:w.is_flagged,
      onCopy:(e)=>{e.stopPropagation();this.copy(w.address);}, onOpen:()=>this.openWallet(w)
    };
  }
  txVM(x){
    const t=this.T_(); const st=this.TXSTAT[x.status]||this.TXSTAT.success;
    return {
      raw:x, short:this.shorten(x.tx_hash,8,6),
      sender:this.shorten(x.sender_address), receiver:this.shorten(x.receiver_address),
      amount:this.weiToEth(x.amount,3), block:this.num(x.block_number), dateStr:this.fmtDate(Date.parse(x.transaction_timestamp)),
      statusLabel:t.txStatus[x.status]||x.status, statusStyle:'background:'+st.b+';color:'+st.c+';',
      onCopy:(e)=>{e.stopPropagation();this.copy(x.tx_hash);}, onOpen:()=>this.openTx(x)
    };
  }
  ruleVM(r){
    return { raw:r, name:r.name, desc:r.description||'', score:Math.round(r.score), active:r.is_active,
      toggleStyle:'background:'+(r.is_active?'var(--accent)':'var(--border)')+';',
      knobStyle:'transform:translateX('+(r.is_active?'18px':'0px')+');',
      onToggle:()=>this.toggleRule(r) };
  }

  // ============================ RENDER ============================
  render(){
    const s=this.state;
    return h('div',{'data-theme':s.theme,style:css("min-height:100vh;height:100vh;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;")},
      s.loggedIn? this.renderApp() : this.renderLogin(),
      s.toast? h('div',{style:css("position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);")},s.toast):null
    );
  }

  renderLangSwitch(small){
    const s=this.state;
    const langs=[{k:'ru',l:'RU'},{k:'kk',l:'KK'},{k:'en',l:'EN'}];
    const pad = small? '5px 10px':'6px 12px';
    const fs = small? '11.5px':'12px';
    return langs.map(x=>{
      const active=s.lang===x.k;
      const st = active?'background:var(--accent);color:#06201c;':'background:transparent;color:var(--muted);';
      return h('button',{key:x.k,onClick:()=>this.setState({lang:x.k}),
        style:css('border:none;border-radius:8px;padding:'+pad+';font-size:'+fs+';font-weight:700;font-family:inherit;cursor:pointer;transition:all .18s;'+st)},x.l);
    });
  }

  renderLogin(){
    const t=this.T_();
    return h('div',{style:css("height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(900px 600px at 50% -10%,var(--accent-soft),transparent 60%),var(--bg);overflow:hidden;")},
      h('div',{style:css("position:absolute;top:24px;right:28px;display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:4px;")}, this.renderLangSwitch(false)),
