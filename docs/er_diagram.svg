<svg viewBox="0 0 1320 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .ent-title { font-size: 15px; font-weight: bold; fill: #ffffff; }
    .ent-title-bg { fill: #1f2d3d; }
    .stub-title-bg { fill: #8a94a0; }
    .pk { font-size: 12px; font-weight: bold; fill: #1f2d3d; }
    .fk { font-size: 12px; fill: #b23b00; }
    .field { font-size: 12px; fill: #333333; }
    .type { font-size: 11px; fill: #888888; }
    .ent-box { fill: #ffffff; stroke: #1f2d3d; stroke-width: 1.5; }
    .stub-box { fill: #f4f5f7; stroke: #8a94a0; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .row-sep { stroke: #e3e6ea; stroke-width: 1; }
    .rel { stroke: #555555; stroke-width: 1.5; fill: none; }
    .rel-stub { stroke: #8a94a0; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .rel-label { font-size: 11px; fill: #555555; }
    .card { font-size: 12px; font-weight: bold; fill: #1f2d3d; }
    .legend { font-size: 12px; fill: #444444; }
    .diagram-title { font-size: 20px; font-weight: bold; fill: #1f2d3d; }
    .subtitle { font-size: 13px; fill: #666666; }
    .stub-note { font-size: 11px; font-style: italic; fill: #8a94a0; }
  </style>

  <text x="40" y="38" class="diagram-title">ER-диаграмма доменной модели</text>
  <text x="40" y="60" class="subtitle">Система мониторинга криптовалютных операций (Ethereum, первая версия)</text>

  <g>
    <rect x="40" y="95" width="230" height="150" rx="6" class="ent-box"/>
    <rect x="40" y="95" width="230" height="30" rx="6" class="ent-title-bg"/>
    <rect x="40" y="110" width="230" height="15" class="ent-title-bg"/>
    <text x="155" y="115" text-anchor="middle" class="ent-title">BlockchainNetwork</text>
    <text x="52" y="145" class="pk">PK  id</text><text x="258" y="145" text-anchor="end" class="type">int</text>
    <line x1="40" y1="155" x2="270" y2="155" class="row-sep"/>
    <text x="52" y="171" class="field">name</text><text x="258" y="171" text-anchor="end" class="type">string</text>
    <text x="52" y="191" class="field">symbol</text><text x="258" y="191" text-anchor="end" class="type">string</text>
    <text x="52" y="211" class="field">is_active</text><text x="258" y="211" text-anchor="end" class="type">bool</text>
    <text x="52" y="231" class="field">created_at</text><text x="258" y="231" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="40" y="300" width="230" height="252" rx="6" class="ent-box"/>
    <rect x="40" y="300" width="230" height="30" rx="6" class="ent-title-bg"/>
    <rect x="40" y="315" width="230" height="15" class="ent-title-bg"/>
    <text x="155" y="320" text-anchor="middle" class="ent-title">Wallet</text>
    <text x="52" y="350" class="pk">PK  id</text><text x="258" y="350" text-anchor="end" class="type">int</text>
    <line x1="40" y1="360" x2="270" y2="360" class="row-sep"/>
    <text x="52" y="376" class="field">address</text><text x="258" y="376" text-anchor="end" class="type">string</text>
    <text x="52" y="396" class="fk">FK  network_id</text><text x="258" y="396" text-anchor="end" class="type">→ Network</text>
    <text x="52" y="416" class="field">first_seen / last_seen</text><text x="258" y="416" text-anchor="end" class="type">datetime</text>
    <text x="52" y="436" class="field">transaction_count</text><text x="258" y="436" text-anchor="end" class="type">int</text>
    <text x="52" y="456" class="field">total_received / sent</text><text x="258" y="456" text-anchor="end" class="type">decimal</text>
    <text x="52" y="476" class="field">risk_score (агрегат)</text><text x="258" y="476" text-anchor="end" class="type">decimal</text>
    <text x="52" y="496" class="field">is_flagged</text><text x="258" y="496" text-anchor="end" class="type">bool</text>
    <text x="52" y="516" class="field">label</text><text x="258" y="516" text-anchor="end" class="type">string?</text>
    <text x="52" y="536" class="field">created / updated_at</text><text x="258" y="536" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="430" y="300" width="270" height="272" rx="6" class="ent-box"/>
    <rect x="430" y="300" width="270" height="30" rx="6" class="ent-title-bg"/>
    <rect x="430" y="315" width="270" height="15" class="ent-title-bg"/>
    <text x="565" y="320" text-anchor="middle" class="ent-title">Transaction</text>
    <text x="442" y="350" class="pk">PK  id</text><text x="688" y="350" text-anchor="end" class="type">int</text>
    <line x1="430" y1="360" x2="700" y2="360" class="row-sep"/>
    <text x="442" y="376" class="field">tx_hash</text><text x="688" y="376" text-anchor="end" class="type">string</text>
    <text x="442" y="396" class="fk">FK  network_id</text><text x="688" y="396" text-anchor="end" class="type">→ Network</text>
    <text x="442" y="416" class="fk">FK  sender_wallet_id</text><text x="688" y="416" text-anchor="end" class="type">→ Wallet</text>
    <text x="442" y="436" class="fk">FK  receiver_wallet_id</text><text x="688" y="436" text-anchor="end" class="type">→ Wallet</text>
    <text x="442" y="456" class="field">amount / currency</text><text x="688" y="456" text-anchor="end" class="type">decimal</text>
    <text x="442" y="476" class="field">gas_fee</text><text x="688" y="476" text-anchor="end" class="type">decimal</text>
    <text x="442" y="496" class="field">block_number</text><text x="688" y="496" text-anchor="end" class="type">int</text>
    <text x="442" y="516" class="field">transaction_timestamp</text><text x="688" y="516" text-anchor="end" class="type">datetime</text>
    <text x="442" y="536" class="field">status</text><text x="688" y="536" text-anchor="end" class="type">string</text>
    <text x="442" y="556" class="field">created_at</text><text x="688" y="556" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="40" y="615" width="230" height="170" rx="6" class="ent-box"/>
    <rect x="40" y="615" width="230" height="30" rx="6" class="ent-title-bg"/>
    <rect x="40" y="630" width="230" height="15" class="ent-title-bg"/>
    <text x="155" y="635" text-anchor="middle" class="ent-title">Rule</text>
    <text x="52" y="665" class="pk">PK  id</text><text x="258" y="665" text-anchor="end" class="type">int</text>
    <line x1="40" y1="675" x2="270" y2="675" class="row-sep"/>
    <text x="52" y="691" class="field">name</text><text x="258" y="691" text-anchor="end" class="type">string</text>
    <text x="52" y="711" class="field">description</text><text x="258" y="711" text-anchor="end" class="type">text</text>
    <text x="52" y="731" class="field">score</text><text x="258" y="731" text-anchor="end" class="type">decimal</text>
    <text x="52" y="751" class="field">is_active</text><text x="258" y="751" text-anchor="end" class="type">bool</text>
    <text x="52" y="771" class="field">created_at</text><text x="258" y="771" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="430" y="620" width="270" height="190" rx="6" class="ent-box"/>
    <rect x="430" y="620" width="270" height="30" rx="6" class="ent-title-bg"/>
    <rect x="430" y="635" width="270" height="15" class="ent-title-bg"/>
    <text x="565" y="640" text-anchor="middle" class="ent-title">WalletRisk</text>
    <text x="442" y="670" class="pk">PK  id</text><text x="688" y="670" text-anchor="end" class="type">int</text>
    <line x1="430" y1="680" x2="700" y2="680" class="row-sep"/>
    <text x="442" y="696" class="fk">FK  wallet_id</text><text x="688" y="696" text-anchor="end" class="type">→ Wallet</text>
    <text x="442" y="716" class="field">rule_score</text><text x="688" y="716" text-anchor="end" class="type">decimal</text>
    <text x="442" y="736" class="field">ml_score</text><text x="688" y="736" text-anchor="end" class="type">decimal</text>
    <text x="442" y="756" class="field">final_score</text><text x="688" y="756" text-anchor="end" class="type">decimal</text>
    <text x="442" y="776" class="field">risk_level</text><text x="688" y="776" text-anchor="end" class="type">LOW..CRIT</text>
    <text x="442" y="796" class="field">created_at</text><text x="688" y="796" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="780" y="300" width="270" height="210" rx="6" class="ent-box"/>
    <rect x="780" y="300" width="270" height="30" rx="6" class="ent-title-bg"/>
    <rect x="780" y="315" width="270" height="15" class="ent-title-bg"/>
    <text x="915" y="320" text-anchor="middle" class="ent-title">TransactionRisk</text>
    <text x="792" y="350" class="pk">PK  id</text><text x="1038" y="350" text-anchor="end" class="type">int</text>
    <line x1="780" y1="360" x2="1050" y2="360" class="row-sep"/>
    <text x="792" y="376" class="fk">FK  transaction_id</text><text x="1038" y="376" text-anchor="end" class="type">→ Transaction</text>
    <text x="792" y="396" class="field">rule_score</text><text x="1038" y="396" text-anchor="end" class="type">decimal</text>
    <text x="792" y="416" class="field">ml_score</text><text x="1038" y="416" text-anchor="end" class="type">decimal</text>
    <text x="792" y="436" class="field">final_score</text><text x="1038" y="436" text-anchor="end" class="type">decimal</text>
    <text x="792" y="456" class="field">risk_level</text><text x="1038" y="456" text-anchor="end" class="type">LOW..CRIT</text>
    <text x="792" y="476" class="field">created_at</text><text x="1038" y="476" text-anchor="end" class="type">datetime</text>
  </g>

  <g>
    <rect x="780" y="570" width="270" height="240" rx="6" class="ent-box"/>
    <rect x="780" y="570" width="270" height="30" rx="6" class="ent-title-bg"/>
    <rect x="780" y="585" width="270" height="15" class="ent-title-bg"/>
    <text x="915" y="590" text-anchor="middle" class="ent-title">Alert</text>
    <text x="792" y="620" class="pk">PK  id</text><text x="1038" y="620" text-anchor="end" class="type">int</text>
    <line x1="780" y1="630" x2="1050" y2="630" class="row-sep"/>
    <text x="792" y="646" class="fk">FK  risk_id</text><text x="1038" y="646" text-anchor="end" class="type">→ *Risk</text>
    <text x="792" y="666" class="field">target_type</text><text x="1038" y="666" text-anchor="end" class="type">tx / wallet</text>
    <text x="792" y="686" class="field">title</text><text x="1038" y="686" text-anchor="end" class="type">string</text>
    <text x="792" y="706" class="field">description</text><text x="1038" y="706" text-anchor="end" class="type">text</text>
    <text x="792" y="726" class="field">level</text><text x="1038" y="726" text-anchor="end" class="type">low/med/high</text>
    <text x="792" y="746" class="field">status</text><text x="1038" y="746" text-anchor="end" class="type">open/closed..</text>
    <text x="792" y="766" class="field">created_at</text><text x="1038" y="766" text-anchor="end" class="type">datetime</text>
    <text x="792" y="786" class="field">resolved_at</text><text x="1038" y="786" text-anchor="end" class="type">datetime?</text>
  </g>

  <g>
    <rect x="1100" y="95" width="190" height="150" rx="6" class="stub-box"/>
    <rect x="1100" y="95" width="190" height="28" rx="6" class="stub-title-bg"/>
    <rect x="1100" y="109" width="190" height="14" class="stub-title-bg"/>
    <text x="1195" y="114" text-anchor="middle" class="ent-title">User</text>
    <text x="1112" y="143" class="field">id, username, email</text>
    <text x="1112" y="163" class="field">first_name, last_name</text>
    <text x="1112" y="183" class="field">role</text>
    <text x="1112" y="203" class="type">Analyst / Investigator /</text>
    <text x="1112" y="219" class="type">Administrator</text>
    <text x="1112" y="239" class="stub-note">— задел, не реализуем —</text>
  </g>
  <g>
    <rect x="1100" y="300" width="190" height="155" rx="6" class="stub-box"/>
    <rect x="1100" y="300" width="190" height="28" rx="6" class="stub-title-bg"/>
    <rect x="1100" y="314" width="190" height="14" class="stub-title-bg"/>
    <text x="1195" y="319" text-anchor="middle" class="ent-title">Investigation</text>
    <text x="1112" y="348" class="field">id, title, description</text>
    <text x="1112" y="368" class="field">created_by → User</text>
    <text x="1112" y="388" class="field">status</text>
    <text x="1112" y="408" class="type">OPEN / ACTIVE / CLOSED</text>
    <text x="1112" y="428" class="field">группирует Alert</text>
    <text x="1112" y="448" class="stub-note">— задел, не реализуем —</text>
  </g>

  <path d="M 155 245 V 300" class="rel"/>
  <text x="162" y="264" class="card">1</text>
  <text x="162" y="294" class="card">∗</text>

  <path d="M 270 170 H 350 V 396 H 430" class="rel"/>
  <text x="356" y="190" class="rel-label">1 — ∗</text>

  <path d="M 270 416 H 430" class="rel"/>
  <text x="292" y="410" class="card">1</text>
  <text x="402" y="410" class="card">∗</text>
  <text x="300" y="432" class="rel-label">sender / receiver</text>

  <path d="M 700 400 H 780" class="rel"/>
  <text x="712" y="394" class="card">1</text>
  <text x="762" y="394" class="card">∗</text>

  <path d="M 270 470 H 350 V 695 H 430" class="rel"/>
  <text x="356" y="690" class="card">1 — ∗</text>

  <path d="M 270 700 H 350 V 760 H 430" class="rel-stub"/>
  <text x="290" y="730" class="rel-label">использует</text>
  <text x="290" y="746" class="rel-label">Rule Engine</text>

  <path d="M 915 510 V 570" class="rel"/>
  <text x="922" y="530" class="card">1</text>
  <text x="922" y="564" class="card">1</text>

  <path d="M 700 720 H 740 V 660 H 780" class="rel"/>
  <text x="710" y="714" class="card">1</text>
  <text x="762" y="654" class="card">1</text>

  <path d="M 1195 455 V 700 H 1050" class="rel-stub"/>
  <text x="1090" y="560" class="rel-label" fill="#8a94a0">группирует (будущее)</text>

  <text x="780" y="125" class="legend" font-weight="bold">Обозначения:</text>
  <text x="780" y="147" class="legend">PK — первичный ключ,  FK — внешний ключ</text>
  <text x="780" y="167" class="legend">1 — ∗  : один-ко-многим</text>
  <text x="780" y="187" class="legend">1 — 1  : один-к-одному</text>
  <line x1="780" y1="201" x2="838" y2="201" class="rel-stub"/>
  <text x="848" y="205" class="legend">задел на будущее (не реализуем сейчас)</text>
</svg>
